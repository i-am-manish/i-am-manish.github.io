<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
      --glow: 0 0 25px rgba(255,59,122,.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FLOATING HEARTS */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 18px;
      opacity: .5;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-120vh) translateX(var(--x));
        opacity: 0;
      }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 28px 22px 34px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      animation: heartbeat 3.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.01); }
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 8px;
      cursor: pointer;
      transition: transform .3s ease;
    }

    .art:active {
      transform: scale(1.05) rotate(-2deg);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 14px 0 20px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 160px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
      box-shadow: var(--glow);
    }

    #yesBtn:hover {
      background: var(--yesHover);
      box-shadow: 0 0 35px rgba(255,59,122,.6);
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: .75;
      min-height: 1.2em;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .4s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- ART -->
    <svg class="art" id="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path id="tinyHeart" d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>
    </svg>

    <h1>Apoorva, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙃</button>
    </section>

    <div class="hint" id="hint">The “No” button is feeling mischievous…</div>

    <section class="result" id="result">
      <h2 id="finalText"></h2>
      <img class="fireworks"
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" />
    </section>
  </main>

  <script>
    /* FLOATING HEARTS */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() > .5 ? "💖" : "💗";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 6 + Math.random() * 4 + "s";
      h.style.setProperty("--x", (Math.random() * 100 - 50) + "px");
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 10000);
    }, 600);

    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const finalText = document.getElementById("finalText");
    const art = document.getElementById("art");

    const taunts = [
      "Nice try 😏",
      "Almost had it!",
      "Still no?",
      "Come onnn 💕",
      "That button is tired"
    ];

    let yesScale = 1;
    let tauntIndex = 0;

    function growYes() {
      yesScale = Math.min(2.3, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    zone.addEventListener("pointermove", e => {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 140) {
        noBtn.style.left = clamp(Math.random() * (z.width - b.width), 0, z.width - b.width) + "px";
        noBtn.style.top = clamp(Math.random() * (z.height - b.height), 0, z.height - b.height) + "px";
        hint.textContent = taunts[tauntIndex++ % taunts.length];
        growYes();
      }
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    art.addEventListener("click", () => {
      art.style.filter = "drop-shadow(0 0 18px #ff4d7d)";
      setTimeout(() => art.style.filter = "", 400);
    });

    /* CONFETTI */
    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = confetti.create(confettiCanvas, { resize: true });

    function typeText(text) {
      let i = 0;
      finalText.textContent = "";
      const t = setInterval(() => {
        finalText.textContent += text[i++];
        if (i >= text.length) clearInterval(t);
      }, 60);
    }

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      typeText("YAY! You just made my heart do backflips 💘");

      confettiInstance({
        particleCount: 350,
        spread: 140,
        startVelocity: 55,
        origin: { x: 0.5, y: 0.55 }
      });
    });
  </script>
</body>
</html>
