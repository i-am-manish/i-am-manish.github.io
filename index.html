<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
      --glow: 0 0 25px rgba(255,59,122,.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* 🍓 STRAWBERRY RAIN */
    .strawberry {
      position: fixed;
      top: -30px;
      font-size: 22px;
      animation: strawberryFall linear infinite;
      pointer-events: none;
      opacity: .9;
      z-index: 1;
    }

    @keyframes strawberryFall {
      to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0.8;
      }
    }

    /* FLOATING HEARTS */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 18px;
      opacity: .55;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-120vh) translateX(var(--x));
        opacity: 0;
      }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 28px 22px 34px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      animation: heartbeat 3.5s ease-in-out infinite;
      position: relative;
      z-index: 10;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.01); }
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 14px 0 20px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 160px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
      box-shadow: var(--glow);
    }

    #yesBtn:hover {
      background: var(--yesHover);
      box-shadow: 0 0 35px rgba(255,59,122,.6);
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: .75;
      min-height: 1.2em;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .4s ease;
    }

    .hug {
      width: min(380px, 90vw);
      border-radius: 22px;
      margin: 10px auto 0;
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
      animation: cuddle 2.5s ease-in-out infinite;
      display: block;
    }

    .love-note {
      margin-top: 10px;
      font-size: 15px;
      opacity: .8;
    }

    @keyframes cuddle {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes pop {
      from { transform: scale(.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <h1>Apoorva, will you be my valentine? 🍓💖</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙃</button>
    </section>

    <div class="hint" id="hint">The “No” button is scared 🍓</div>

    <section class="result" id="result">
      <h2 id="finalText"></h2>

      <img
        class="hug"
        src="https://media.giphy.com/media/lrr9rHuoJOE0w/giphy.gif"
        alt="Cute cats hugging"
      />

      <p class="love-note">Strawberries + us = perfect 🍓🐱💞</p>
    </section>
  </main>

  <script>
    /* 🍓 STRAWBERRY RAIN */
    setInterval(() => {
      const s = document.createElement("div");
      s.className = "strawberry";
      s.textContent = "🍓";
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = 5 + Math.random() * 4 + "s";
      s.style.fontSize = 18 + Math.random() * 14 + "px";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 9000);
    }, 250);

    /* FLOATING HEARTS */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() > .5 ? "💖" : "💗";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 6 + Math.random() * 4 + "s";
      h.style.setProperty("--x", (Math.random() * 100 - 50) + "px");
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 10000);
    }, 700);

    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const finalText = document.getElementById("finalText");

    let yesScale = 1;

    function growYes() {
      yesScale = Math.min(2.4, yesScale + 0.12);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    zone.addEventListener("pointermove", e => {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 140) {
        noBtn.style.left = Math.random() * (z.width - b.width) + "px";
        noBtn.style.top = Math.random() * (z.height - b.height) + "px";
        growYes();
      }
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    /* CONFETTI */
    const confettiInstance = confetti.create(document.getElementById("confettiCanvas"), { resize: true });

    function typeText(text) {
      let i = 0;
      finalText.textContent = "";
      const t = setInterval(() => {
        finalText.textContent += text[i++];
        if (i >= text.length) clearInterval(t);
      }, 60);
    }

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      typeText("YAY! Strawberry love forever 🍓💘");

      confettiInstance({
        particleCount: 400,
        spread: 140,
        startVelocity: 55,
        origin: { x: 0.5, y: 0.55 }
      });
    });
  </script>
</body>
</html>
